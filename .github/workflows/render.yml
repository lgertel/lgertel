name: render delivery

# Hourly, and by hand: fetch the public delivery.json from the data repository, check it
# against this repository's own copy of the schema, rewrite the section between the
# delivery markers in README.md, and commit only when the section changed.
# Needs no secret beyond the GITHUB_TOKEN every run is given.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-delivery
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_REPO: ${{ github.repository_owner }}/delivery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: install
        run: bun install --frozen-lockfile

      - name: fetch the reading
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/delivery.json" "https://raw.githubusercontent.com/${DATA_REPO}/main/delivery.json"

      - name: validate and render
        run: bun scripts/render.ts --json "$RUNNER_TEMP/delivery.json" --readme README.md --data-repo "$DATA_REPO"

      - name: commit when the section changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "delivery: render the reading" -- README.md
          git push
